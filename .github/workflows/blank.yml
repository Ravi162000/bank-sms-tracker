name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Android Project
        run: unzip -o BankSmsTracker_Android.zip

      - name: Enable AndroidX
        working-directory: BankSmsTracker_Android
        run: printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: BankSmsTracker_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BankSmsTracker-APK
          path: BankSmsTracker_Android/app/build/outputs/apk/debug/app-debug.apk
